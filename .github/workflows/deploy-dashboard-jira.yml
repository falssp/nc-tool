name: Deploy Dashboard Jira to Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'dashboard-jira/**.gs'
      - 'dashboard-jira/appsscript.json'
      - 'dashboard-jira/Painel.html'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Write credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Apps Script
        working-directory: ./dashboard-jira
        run: clasp push --force

      - name: Notify success
        run: echo "✅ Deploy Dashboard Jira concluído em $(date +'%d/%m/%Y %H:%M')"
