<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dicionário de Taxonomias — Unilever BR</title>
<style>
  /* Paleta Unilever */
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #eef0f7;
    --border: #d6d9e8;
    --border-strong: #b0b5d0;
    --text: #0d1333;
    --text2: #3d4466;
    --text3: #7b82a8;
    --accent: #1F36C7;
    --accent-bg: #eef0fb;
    --accent-border: #bcc4ef;
    --accent-text: #1a2da8;
    --accent-dark: #003087;
    --radius: 8px;
    --mono: 'Courier New', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1120;
      --surface: #141828;
      --surface2: #1a2035;
      --border: #252d4a;
      --border-strong: #323d60;
      --text: #e8eaf5;
      --text2: #9ba5cc;
      --text3: #5c6488;
      --accent: #5c78f0;
      --accent-bg: #141e45;
      --accent-border: #2535a0;
      --accent-text: #8fa3f5;
      --accent-dark: #4060d0;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.25rem 1.5rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .logo { display: flex; flex-direction: column; gap: 1px; }
  .logo-title { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
  .logo-sub { font-size: 11px; color: var(--text3); }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text3); pointer-events: none; }
  #search { width: 100%; padding: 7px 12px 7px 34px; font-size: 13px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  .meta { font-size: 11px; color: var(--text3); white-space: nowrap; }

  /* LAYOUT */
  .layout { max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 220px 1fr; gap: 0; min-height: calc(100vh - 64px); }

  /* SIDEBAR */
  aside { border-right: 1px solid var(--border); padding: 1.25rem 0; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
  .sidebar-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; padding: 0 1rem .5rem; }
  .nav-item { display: block; padding: 6px 1rem; font-size: 12.5px; color: var(--text2); cursor: pointer; border-radius: 0; transition: background .1s, color .1s; border-left: 2px solid transparent; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent-bg); color: var(--accent-text); border-left-color: var(--accent-dark); font-weight: 500; }
  .nav-item .nav-count { float: right; font-size: 11px; color: var(--text3); background: var(--surface2); padding: 1px 6px; border-radius: 10px; }
  .nav-item.active .nav-count { background: var(--accent-border); color: var(--accent-text); }
  .nav-all { font-weight: 500; }

  /* MAIN */
  main { padding: 1.5rem; overflow-y: auto; }
  .results-bar { font-size: 12px; color: var(--text3); margin-bottom: 1rem; }

  /* FIELD BLOCK */
  .field-block { margin-bottom: 2rem; scroll-margin-top: 80px; }
  .field-header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }
  .field-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .field-desc { font-size: 11.5px; color: var(--text3); }
  .field-count { margin-left: auto; font-size: 11px; color: var(--text3); background: var(--surface2); padding: 2px 8px; border-radius: 10px; white-space: nowrap; }

  /* CARDS */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .65rem .85rem; cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: var(--border-strong); }
  .card.open { border-color: var(--accent-dark); background: var(--accent-bg); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .opt-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.35; }
  .abr { font-size: 11px; color: var(--accent-text); background: var(--accent-border); padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-family: var(--mono); flex-shrink: 0; }
  .card-body { display: none; margin-top: .6rem; padding-top: .6rem; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }
  .card-sig { font-size: 12px; color: var(--text2); line-height: 1.65; margin-bottom: .5rem; }
  .plat-row { display: flex; gap: 6px; align-items: flex-start; }
  .plat-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; padding-top: 2px; white-space: nowrap; }
  .plat-val { font-size: 11px; color: var(--text2); }
  .rel-row { margin-top: 4px; }

  /* HIGHLIGHT */
  mark { background: #fef08a; color: #713f12; border-radius: 2px; padding: 0 1px; }
  @media (prefers-color-scheme: dark) { mark { background: #713f12; color: #fef9c3; } }

  /* EMPTY */
  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 13px; }

  /* BADGE */
  .rel-badge { display: inline-block; font-size: 10px; background: var(--surface2); color: var(--text3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; margin: 2px 2px 0 0; }

  /* RESPONSIVE */
  @media (max-width: 720px) {
    .layout { grid-template-columns: 1fr; }
    aside { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: .75rem 0; display: flex; flex-wrap: wrap; gap: 4px; padding: .75rem .75rem; }
    .sidebar-label { display: none; }
    .nav-item { padding: 4px 10px; border-left: none; border-radius: 20px; border: 1px solid var(--border); font-size: 12px; }
    .nav-item.active { border-color: var(--accent); }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-title">Dicionário de Taxonomias</span>

    </div>
    <div class="search-wrap">

      <input type="text" id="search" placeholder="Buscar campo, opção, abreviação ou significado…" autocomplete="off">

</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="results-bar" id="results-bar"></div>
    <div id="out"></div>

      { opt: "Dynamic Search Ads + Broad + Exact", abr: "", sig: "Combinação de Dynamic Search Ads, Correspondência Ampla e Correspondência Exata.", plat: "Google Search" },
      { opt: "Dynamic Search Ads + Broad + Phrase", abr: "", sig: "Combinação de Dynamic Search Ads, Correspondência Ampla e Correspondência de Frase.", plat: "Google Search" },
      { opt: "Dynamic Search Ads + Phrase + Exact", abr: "", sig: "Combinação de Dynamic Search Ads, Correspondência de Frase e Correspondência Exata.", plat: "Google Search" },
      { opt: "Dynamic Search Ads + Broad + Exact + Phrase", abr: "", sig: "Combinação de Dynamic Search Ads, Correspondência Ampla, Correspondência Exata e Correspondência de Frase.", plat: "Google Search" },
      { opt: "Exact Match + Phrase", abr: "", sig: "Combinação de Correspondência Exata e Correspondência de Frase.", plat: "Google Search" },
      { opt: "Exact Match + Broad", abr: "", sig: "Combinação de Correspondência Exata e Correspondência Ampla.", plat: "Google Search" },
      { opt: "Exact Match + Broad + Phrase", abr: "", sig: "Combinação de Correspondência Exata, Correspondência Ampla e Correspondência de Frase.", plat: "Google Search" },
    ]
  }
];

// ---- state ----
let activeField = null;
let openCards = new Set();
let q = '';

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(text, term){
  if(!term) return esc(text);
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}

function render(){
  let total = 0;
  let html = '';
  const term = q.trim().toLowerCase();

  DATA.forEach(block => {
    if(activeField && block.id !== activeField) return;
    const items = block.items.filter(it => {
      if(!term) return true;
      return it.opt.toLowerCase().includes(term) ||
             (it.abr && it.abr.toLowerCase().includes(term)) ||
             it.sig.toLowerCase().includes(term) ||
             block.field.toLowerCase().includes(term) ||
             (it.plat && it.plat.toLowerCase().includes(term)) ||
             (it.rel && it.rel.toLowerCase().includes(term));
    });
    if(!items.length) return;
    total += items.length;

    html += `<section class="field-block" id="sec-${block.id}">
      <div class="field-header">
        <span class="field-name">${highlight(block.field, term)}</span>
        <span class="field-desc">${esc(block.desc)}</span>
        <span class="field-count">${items.length}</span>
      </div>
      <div class="cards">`;

    items.forEach(it => {
      const key = block.id + '::' + it.opt;
      const open = openCards.has(key);
      html += `<div class="card${open?' open':''}" data-key="${esc(key)}">
        <div class="card-top">
          <span class="opt-name">${highlight(it.opt, term)}</span>
          ${it.abr ? `<span class="abr">${highlight(it.abr, term)}</span>` : ''}
        </div>
        <div class="card-body">
          <p class="card-sig">${highlight(it.sig, term)}</p>
          <div class="plat-row">
            <span class="plat-label">Plataforma&nbsp;</span>
            <span class="plat-val">${highlight(it.plat||'—', term)}</span>
          </div>
          ${it.rel ? `<div class="plat-row rel-row"><span class="plat-label">Relação&nbsp;</span><span class="plat-val">${esc(it.rel)}</span></div>` : ''}
        </div>
      </div>`;
    });
    html += `</div></section>`;
  });

  const out = document.getElementById('out');
  out.innerHTML = html || `<div class="empty">Nenhum resultado para "<strong>${esc(q)}</strong>".</div>`;
  document.getElementById('results-bar').textContent = total + ' opções';
  document.getElementById('meta').textContent = total + ' opções';

  out.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.key;
      if(openCards.has(k)) openCards.delete(k);
      else openCards.add(k);
      render();
      el.scrollIntoView({block:'nearest'});
    });
  });
}

function buildSidebar(){
  const sb = document.getElementById('sidebar');
  const lbl = document.createElement('div');
  lbl.className = 'sidebar-label';
  lbl.textContent = 'Campos';
  sb.appendChild(lbl);

  const all = document.createElement('a');
  all.className = 'nav-item nav-all active';
  all.textContent = 'Todos';
  const tot = DATA.reduce((a,b) => a + b.items.length, 0);
  all.innerHTML += `<span class="nav-count">${tot}</span>`;
  all.href = '#';
  all.onclick = e => { e.preventDefault(); activeField = null; setActive(all); render(); };
  sb.appendChild(all);

  DATA.forEach(block => {
    const a = document.createElement('a');
    a.className = 'nav-item';
    a.href = '#sec-' + block.id;
    a.innerHTML = esc(block.field) + `<span class="nav-count">${block.items.length}</span>`;
    a.onclick = e => {
      if(activeField === block.id){ e.preventDefault(); setActive(a); activeField = block.id; render(); }
      else { activeField = null; setActive(a); }
    };
    sb.appendChild(a);
  });
}

function setActive(el){
  document.querySelectorAll('.nav-item').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
}

document.getElementById('search').addEventListener('input', e => {
  q = e.target.value;
  render();
});

buildSidebar();
render();
</script>
</body>
</html>
