<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dicionário de Taxonomias — Unilever BR</title>
<style>
  /* Paleta Unilever */
  :root {
    --bg: #f5f6fa;
    --surface: #ffffff;
    --surface2: #eef0f7;
    --border: #d6d9e8;
    --border-strong: #b0b5d0;
    --text: #0d1333;
    --text2: #3d4466;
    --text3: #7b82a8;
    --accent: #1F36C7;
    --accent-bg: #eef0fb;
    --accent-border: #bcc4ef;
    --accent-text: #1a2da8;
    --accent-dark: #003087;
    --radius: 8px;
    --mono: 'Courier New', monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1120;
      --surface: #141828;
      --surface2: #1a2035;
      --border: #252d4a;
      --border-strong: #323d60;
      --text: #e8eaf5;
      --text2: #9ba5cc;
      --text3: #5c6488;
      --accent: #5c78f0;
      --accent-bg: #141e45;
      --accent-border: #2535a0;
      --accent-text: #8fa3f5;
      --accent-dark: #4060d0;
    }
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* HEADER */
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.25rem 1.5rem; position: sticky; top: 0; z-index: 100; }
  .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .logo { display: flex; flex-direction: column; gap: 1px; }
  .logo-title { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: -.01em; }
  .logo-sub { font-size: 11px; color: var(--text3); }
  .search-wrap { flex: 1; min-width: 200px; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text3); pointer-events: none; }
  #search { width: 100%; padding: 7px 12px 7px 34px; font-size: 13px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--bg); color: var(--text); outline: none; }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

  /* DROPDOWN PLATAFORMA */
  .plat-wrap { position: relative; }
  .plat-btn { height: 36px; padding: 0 12px; font-size: 13px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface2); color: var(--text2); cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; transition: border-color .12s; }
  .plat-btn:hover { border-color: var(--accent); }
  .plat-btn.active { border-color: var(--accent); background: var(--accent-bg); color: var(--accent-text); }
  .plat-badge { background: var(--accent); color: #fff; font-size: 10px; font-weight: 700; border-radius: 10px; padding: 1px 6px; min-width: 18px; text-align: center; }
  .plat-dropdown { position: absolute; top: calc(100% + 6px); right: 0; background: var(--surface); border: 1px solid var(--border-strong); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: .5rem; min-width: 200px; z-index: 200; display: none; }
  .plat-dropdown.open { display: block; }
  .plat-dropdown-header { display: flex; justify-content: space-between; align-items: center; padding: 2px 6px 6px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
  .plat-dropdown-label { font-size: 10px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; }
  .plat-dropdown-clear { font-size: 11px; color: var(--accent-text); cursor: pointer; }
  .plat-dropdown-clear:hover { text-decoration: underline; }
  .plat-option { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; cursor: pointer; transition: background .1s; }
  .plat-option:hover { background: var(--surface2); }
  .plat-option input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
  .plat-option label { font-size: 12.5px; color: var(--text2); cursor: pointer; line-height: 1.3; }
  .meta { font-size: 11px; color: var(--text3); white-space: nowrap; transition: opacity .2s; }
  .meta.hidden { opacity: 0; pointer-events: none; }
  .expand-btns { display: flex; gap: 4px; }
  .expand-btn { height: 30px; padding: 0 10px; font-size: 11px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface2); color: var(--text2); cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; }
  .expand-btn:hover { background: var(--accent-bg); border-color: var(--accent); color: var(--accent-text); }

  /* LAYOUT */
  .layout { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 220px 1fr; gap: 0; min-height: calc(100vh - 64px); align-items: start; }

  /* SIDEBAR */
  /* aside — ver nav-clear section acima */
  .sidebar-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; padding: 0 1rem .5rem; }
  .nav-item { display: block; padding: 6px 1rem; font-size: 12.5px; color: var(--text2); cursor: pointer; border-radius: 0; transition: background .1s, color .1s; border-left: 2px solid transparent; }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.on { background: var(--accent-bg); color: var(--accent-text); border-left-color: var(--accent-dark); font-weight: 500; }
  .nav-item.on .nav-count { background: var(--accent-border); color: var(--accent-text); }
  .nav-clear { font-size: 10px; color: var(--text3); cursor: pointer; padding: 2px 8px; margin: 4px 1rem 0; display: none; border-radius: 10px; background: var(--surface2); text-align: center; }
  .nav-clear:hover { color: var(--accent-text); }
  .nav-clear.visible { display: block; }
  /* Grupos sidebar */
  .nav-group-label { font-size: 9px; font-weight: 700; color: var(--text3); letter-spacing: .08em; text-transform: uppercase; padding: 10px 1rem 3px; margin-top: 4px; border-top: 1px solid var(--border); }
  .nav-group-label:first-child { border-top: none; margin-top: 0; }
  /* Sidebar sticky correto */
  aside { border-right: 1px solid var(--border); padding: 1.25rem 0; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; align-self: flex-start; scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
  aside::-webkit-scrollbar { width: 4px; }
  aside::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .nav-item .nav-count { float: right; font-size: 11px; color: var(--text3); background: var(--surface2); padding: 1px 6px; border-radius: 10px; }
  .nav-item.active .nav-count { background: var(--accent-border); color: var(--accent-text); }
  .nav-all { font-weight: 500; }


  /* MAIN */
  main { padding: 1.5rem; overflow-y: auto; }
  .results-bar { font-size: 12px; color: var(--text3); margin-bottom: 1rem; }

  /* FIELD BLOCK */
  .field-block { margin-bottom: 2rem; scroll-margin-top: 80px; }
  .field-header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: .75rem; padding-bottom: .5rem; border-bottom: 1px solid var(--border); }
  .field-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .field-desc { font-size: 11.5px; color: var(--text3); }
  .field-count { margin-left: auto; font-size: 11px; color: var(--text3); background: var(--surface2); padding: 2px 8px; border-radius: 10px; white-space: nowrap; }

  /* CARDS */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: .65rem .85rem; cursor: pointer; transition: border-color .12s; }
  .card:hover { border-color: var(--border-strong); }
  .card.open { border-color: var(--accent-dark); background: var(--accent-bg); }
  .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .opt-name { font-size: 13px; font-weight: 500; color: var(--text); line-height: 1.35; }
  .abr { font-size: 11px; color: var(--accent-text); background: var(--accent-border); padding: 2px 6px; border-radius: 4px; white-space: nowrap; font-family: var(--mono); flex-shrink: 0; }
  .card-body { display: none; margin-top: .6rem; padding-top: .6rem; border-top: 1px solid var(--border); }
  .card.open .card-body { display: block; }
  .card-sig { font-size: 12px; color: var(--text2); line-height: 1.65; margin-bottom: .5rem; }
  .plat-row { display: flex; gap: 6px; align-items: flex-start; }
  .plat-label { font-size: 10px; font-weight: 600; color: var(--text3); letter-spacing: .05em; text-transform: uppercase; padding-top: 2px; white-space: nowrap; }
  .plat-val { font-size: 11px; color: var(--text2); }
  .rel-row { margin-top: 4px; }

  /* HIGHLIGHT */
  mark { background: #fef08a; color: #713f12; border-radius: 2px; padding: 0 1px; }
  @media (prefers-color-scheme: dark) { mark { background: #713f12; color: #fef9c3; } }

  /* EMPTY */
  .empty { text-align: center; padding: 3rem 1rem; color: var(--text3); font-size: 13px; }

  /* BADGE */
  .rel-badge { display: inline-block; font-size: 10px; background: var(--surface2); color: var(--text3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; margin: 2px 2px 0 0; }

  /* ── TIPOGRAFIA FLUIDA ─────────────────────────────────── */
  /* clamp(min, preferred, max) — escala suave entre breakpoints */
  :root {
    --fs-base:    clamp(12px, 1.1vw, 15px);
    --fs-sm:      clamp(10px, 0.9vw, 13px);
    --fs-xs:      clamp(9px,  0.8vw, 11px);
    --fs-heading: clamp(13px, 1.2vw, 16px);
    --fs-card:    clamp(11px, 1vw,   14px);
    --space-card: clamp(.5rem, 1vw, .85rem);
    --radius-lg:  clamp(8px, 1vw, 12px);
  }

  body { font-size: var(--fs-base); }

  .logo-title  { font-size: clamp(13px, 1.2vw, 16px); }
  .logo-sub    { font-size: clamp(9px, 0.8vw, 11px); }
  #search      { font-size: var(--fs-sm); }
  .plat-btn    { font-size: var(--fs-sm); }
  .meta        { font-size: var(--fs-xs); }

  .sidebar-label { font-size: var(--fs-xs); }
  .nav-item      { font-size: clamp(11px, 0.95vw, 13px); }
  .nav-item .nav-count { font-size: var(--fs-xs); }

  .field-name  { font-size: clamp(12px, 1.05vw, 14px); }
  .field-desc  { font-size: var(--fs-xs); }
  .field-count { font-size: var(--fs-xs); }

  .opt-name    { font-size: var(--fs-card); }
  .abr         { font-size: var(--fs-xs); }
  .card-sig    { font-size: clamp(11px, 0.9vw, 13px); }
  .plat-label  { font-size: var(--fs-xs); }
  .plat-val    { font-size: var(--fs-xs); }
  .card        { padding: var(--space-card) calc(var(--space-card) * 1.2); border-radius: var(--radius-lg); }

  .results-bar { font-size: var(--fs-xs); }

  /* ── LAYOUT FLUIDO ──────────────────────────────────────── */

  /* Telão (>1600px) — aproveita a largura toda */
  @media (min-width: 1600px) {
    .layout      { max-width: 100%; padding: 0 2vw; grid-template-columns: 260px 1fr; }
    .header-inner{ max-width: 100%; padding: 0 2vw; }
    main         { padding: 2rem 2vw; }
    .cards       { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  }

  /* Desktop grande (1200–1600px) */
  @media (min-width: 1200px) and (max-width: 1599px) {
    .layout      { max-width: 1400px; grid-template-columns: 240px 1fr; }
    .cards       { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  }

  /* Desktop padrão (900–1199px) — estado atual, sem mudança */

  /* Tablet (600–899px) */
  @media (max-width: 899px) and (min-width: 600px) {
    .layout      { grid-template-columns: 180px 1fr; }
    aside        { padding: 1rem 0; }
    .nav-item    { padding: 5px .75rem; font-size: 11px; }
    .cards       { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 5px; }
    main         { padding: 1rem; }
    header       { padding: .9rem 1rem; }
    .header-inner{ gap: .6rem; }
  }

  /* Celular (< 600px) */
  @media (max-width: 599px) {
    :root {
      --fs-base:    13px;
      --fs-sm:      11px;
      --fs-xs:      10px;
      --fs-card:    12px;
      --space-card: .55rem;
    }

    header { padding: .7rem .9rem; position: sticky; top: 0; z-index: 100; }
    .header-inner { flex-wrap: nowrap; gap: .5rem; }
    .logo-sub { display: none; }
    .search-wrap { min-width: 0; }
    .plat-btn span:not(.plat-badge) { display: none; } /* esconde texto, mantém ícone+badge */
    .plat-btn { padding: 0 8px; gap: 4px; }
    .plat-dropdown { right: -8px; min-width: 180px; }

    .layout { grid-template-columns: 1fr; }

    /* Sidebar vira scroll horizontal no topo */
    aside {
      position: sticky;
      top: 52px;
      z-index: 90;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      padding: .5rem .75rem;
      display: flex;
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      gap: 5px;
      align-self: auto;
      scrollbar-width: none;
    }
    aside::-webkit-scrollbar { display: none; }
    .sidebar-label { display: none; }
    .nav-clear { display: none !important; }

    .nav-item {
      padding: 4px 10px;
      border-left: none;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 11px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .nav-item.on {
      border-color: var(--accent);
      background: var(--accent-bg);
      color: var(--accent-text);
    }
    .nav-item .nav-count { display: none; }

    main { padding: .75rem; }
    .cards { grid-template-columns: 1fr; gap: 5px; }
    .field-header { flex-wrap: wrap; gap: .4rem; }
    .field-desc { display: none; } /* muito texto em tela pequena */
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <span class="logo-title">Dicionário de Taxonomias</span>
      <span class="logo-sub">Unilever BR · StormX Data & Tech</span>
    </div>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Buscar campo, opção, abreviação ou significado…" autocomplete="off">
    </div>
    <div class="plat-wrap" id="plat-wrap">
    <button class="plat-btn" id="plat-btn" onclick="togglePlatDropdown()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M7 12h10M11 18h2"/></svg>
      Plataforma / Formato
      <span class="plat-badge" id="plat-badge" style="display:none">0</span>
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="plat-dropdown" id="plat-dropdown">
      <div class="plat-dropdown-header">
        <span class="plat-dropdown-label">Plataformas</span>
        <span class="plat-dropdown-clear" onclick="clearPlats()">limpar</span>
      </div>
      <div id="plat-options"></div>
    </div>
  </div>
  <div class="expand-btns">
    <button class="expand-btn" onclick="expandAll()" title="Expandir todos os cards">⊞ Expandir</button>
    <button class="expand-btn" onclick="collapseAll()" title="Recolher todos os cards">⊟ Recolher</button>
  </div>
  <span class="meta hidden" id="meta"></span>
  </div>
</header>

<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="results-bar" id="results-bar"></div>
    <div id="out"></div>
  </main>
</div>

<script>
const DATA = [
  {
    id: "objetivo",
    field: "Objetivo GL",
    desc: "Define o principal objetivo de marketing da campanha, indicando o resultado esperado e orientando a estratégia de mídia.",
    items: [
      { opt: "Awareness", abr: "awa", sig: "Campanhas de topo de funil voltadas para ampliar o reconhecimento da marca ou produto. Geralmente priorizam alcance, cobertura e frequência, sem foco em segmentações muito específicas.", plat: "Todas, menos Google" },
      { opt: "Awareness/Consideration", abr: "awacons", sig: "Campanhas que combinam objetivos de reconhecimento e consideração, buscando ampliar a visibilidade enquanto estimulam o interesse e a interação do consumidor.", plat: "Todas, menos Google" },
      { opt: "Consideration", abr: "cons", sig: "Campanhas de meio de funil voltadas para gerar interesse, consideração e engajamento com a marca ou produto. Normalmente utilizam segmentações mais qualificadas.", plat: "Todas, menos Google" },
      { opt: "Conversion", abr: "conv", sig: "Campanhas de fundo de funil focadas em gerar uma ação específica do consumidor: compra, cadastro, download ou outra conversão definida pela estratégia.", plat: "Todas, menos Google" },
      { opt: "Convert", abr: "con", sig: "Utilizado para campanhas baseadas em palavras-chave com foco em conversão, conforme a estrutura de resultados da pesquisa global IAIC da Unilever.", plat: "Google Ads" },
      { opt: "Inform", abr: "Inf", sig: "Utilizado para campanhas baseadas em palavras-chave com o objetivo de informar os consumidores sobre uma marca ou categoria, conforme a estrutura IAIC da Unilever.", plat: "Google Ads" },
      { opt: "Inspire", abr: "Ins", sig: "Utilizado para campanhas baseadas em palavras-chave com o objetivo de inspirar os consumidores sobre uma marca ou categoria, conforme a estrutura IAIC da Unilever.", plat: "Google Ads" },
      { opt: "Advise", abr: "adv", sig: "Utilizado para campanhas baseadas em palavras-chave com o objetivo de orientar ou aconselhar os consumidores sobre uma marca ou categoria, conforme a estrutura IAIC da Unilever.", plat: "Google Ads" },
    ]
  },
  {
    id: "audience-party",
    field: "Audience Party GL",
    desc: "Define a origem dos dados utilizados para segmentação da audiência na campanha.",
    items: [
      { opt: "1PD-DID", abr: "1pd-did", sig: "Utiliza apenas dados próprios (First-Party Data) provenientes de Digital ID Data (DID) — base composta por identificadores digitais anônimos coletados nas propriedades digitais da Unilever.", plat: "Todas" },
      { opt: "1PD-DAD", abr: "1pd-dad", sig: "Utiliza apenas dados próprios (First-Party Data) provenientes de Deterministic Audience Data (DAD) — base composta por consumidores identificados via CRM ou outras fontes determinísticas.", plat: "Todas" },
      { opt: "1PD-DID+DAD", abr: "1pd-diddad", sig: "Utiliza uma combinação das bases DID e DAD para segmentação da audiência.", plat: "Todas" },
      { opt: "No-1PD", abr: "no1pd", sig: "Não utiliza dados próprios (First-Party Data) para segmentação da audiência.", plat: "Todas" },
    ]
  },
  {
    id: "audience-type",
    field: "Audience Type FT",
    desc: "Define o tipo de audiência utilizado para segmentação da campanha, de acordo com a origem ou características dos dados.",
    items: [
      { opt: "CRM", abr: "1PD-DAD", sig: "Audiência composta por dados diretamente identificáveis, como e-mail, telefone ou informações provenientes do CRM da marca.", plat: "Todas", rel: "1PD-DAD" },
      { opt: "Behavioural", abr: "Behav", sig: "Audiência segmentada com base no comportamento do usuário — histórico de navegação, pesquisas realizadas, compras ou sites visitados.", plat: "Todas", rel: "No 1PD" },
      { opt: "Lookalike", abr: "LLike", sig: "Audiência semelhante a um público de origem (seed audience). Utilizada para ampliar o alcance mantendo características similares ao público existente.", plat: "Todas", rel: "1PD-DAD, 1PD-DID, 1PD-DID+DAD" },
      { opt: "CombinedAudiences", abr: "CombAud", sig: "Audiência composta pela combinação de dois ou mais segmentos de público, utilizada para ampliar alcance ou criar segmentações mais qualificadas.", plat: "Todas", rel: "1PD-DAD, 1PD-DID+DAD, No 1PD" },
      { opt: "DMP", abr: "1PD-DID", sig: "Audiência criada em uma Data Management Platform (DMP), como o Adobe Audience Manager, utilizando dados próprios ou segmentos de remarketing.", plat: "Todas", rel: "1PD-DID" },
      { opt: "Collected in-platform", abr: "CollPform", sig: "Audiência criada a partir de dados coletados diretamente pela plataforma de mídia, por meio de pixels, eventos ou ferramentas proprietárias.", plat: "Todas", rel: "1PD-DID" },
      { opt: "Custom", abr: "Cust", sig: "Audiência personalizada, criada especificamente para atender aos objetivos da campanha.", plat: "Todas", rel: "1PD-DID+DAD, No 1PD" },
      { opt: "Demographic", abr: "Demog", sig: "Audiência segmentada por características demográficas, como idade, gênero, renda ou localização.", plat: "Todas", rel: "No 1PD" },
      { opt: "In-Market", abr: "InMark", sig: "Audiência composta por usuários que demonstraram intenção de compra ou interesse ativo em determinada categoria de produtos.", plat: "Todas", rel: "No 1PD" },
      { opt: "Interest/Affinity", abr: "IntAff", sig: "Audiência segmentada com base em interesses, hobbies ou afinidades dos usuários, como esportes, fitness, culinária ou sustentabilidade.", plat: "Todas", rel: "No 1PD" },
      { opt: "In-Market & Lifestyle", abr: "InmLst", sig: "Audiência que combina intenção de compra (In-Market) com características de estilo de vida (Lifestyle), permitindo uma segmentação mais qualificada.", plat: "Todas", rel: "No 1PD" },
      { opt: "Lifestyle/Life Events", abr: "Lstyle", sig: "Audiência segmentada por estilo de vida ou eventos importantes da vida, como novos pais, mudança de residência, casamento ou formatura.", plat: "Todas", rel: "No 1PD" },
    ]
  },

// ---- state ----
let activeFields = new Set();  // multi-select de campos
let activePlats  = new Set();  // multi-select de plataformas
let openCards = new Set();
let q = '';

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(text, term){
  if(!term) return esc(text);
  const re = new RegExp('('+term.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return esc(text).replace(re,'<mark>$1</mark>');
}

function render(){
  let total = 0;
  let html = '';
  const term = q.trim().toLowerCase();

  DATA.forEach(block => {
    if(activeFields.size > 0 && !activeFields.has(block.id)) return;
    const items = block.items.filter(it => {
      // filtro texto
      if(term) {
        const match = it.opt.toLowerCase().includes(term) ||
          (it.abr && it.abr.toLowerCase().includes(term)) ||
          it.sig.toLowerCase().includes(term) ||
          block.field.toLowerCase().includes(term) ||
          (it.plat && it.plat.toLowerCase().includes(term)) ||
          (it.rel && it.rel.toLowerCase().includes(term));
        if(!match) return false;
      }
      // filtro plataforma (AND com campos) com aliases
      if(activePlats.size > 0) {
        const platStr = (it.plat || '').toLowerCase();
        if(platStr.includes('todas')) return true;
        return [...activePlats].some(canon => {
          const aliases = PLAT_ALIASES[canon] || [canon.toLowerCase()];
          return aliases.some(a => platStr.includes(a));
        });
      }
      return true;
    });
    if(!items.length) return;
    total += items.length;

    html += `<section class="field-block" id="sec-${block.id}">
      <div class="field-header">
        <span class="field-name">${highlight(block.field, term)}</span>
        <span class="field-desc">${esc(block.desc)}</span>
        </div>
      <div class="cards">`;

    items.forEach(it => {
      const key = block.id + '::' + it.opt;
      const open = openCards.has(key);
      html += `<div class="card${open?' open':''}" data-key="${esc(key)}">
        <div class="card-top">
          <span class="opt-name">${highlight(it.opt, term)}</span>
          ${it.abr ? `<span class="abr">${highlight(it.abr, term)}</span>` : ''}
        </div>
        <div class="card-body">
          <p class="card-sig">${highlight(it.sig, term)}</p>
          <div class="plat-row">
            <span class="plat-label">Plataforma&nbsp;</span>
            <span class="plat-val">${highlight(it.plat||'—', term)}</span>
          </div>
          ${it.rel ? `<div class="plat-row rel-row"><span class="plat-label">Relação&nbsp;</span><span class="plat-val">${esc(it.rel)}</span></div>` : ''}
        </div>
      </div>`;
    });
    html += `</div></section>`;
  });

  const out = document.getElementById('out');
  out.innerHTML = html || `<div class="empty">Nenhum resultado para "<strong>${esc(q)}</strong>".</div>`;
  document.getElementById('results-bar').textContent = total + ' opções';
  const metaEl = document.getElementById('meta');
  const filtroAtivo = q.trim() || activeFields.size > 0 || activePlats.size > 0;
  if(filtroAtivo) {
    metaEl.textContent = total + ' opções';
    metaEl.classList.remove('hidden');
  } else {
    metaEl.classList.add('hidden');
    metaEl.textContent = '';
  }

  out.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.key;
      if(openCards.has(k)) openCards.delete(k);
      else openCards.add(k);
      render();
      el.scrollIntoView({block:'nearest'});
    });
  });
}

function buildPlatOptions(){
  const wrap = document.getElementById('plat-options');
  PLATAFORMAS.forEach(p => {
    const div = document.createElement('div');
    div.className = 'plat-option';
    const pid = p.replace(/[^a-z0-9]/gi,'-'); div.innerHTML = `<input type="checkbox" id="plat-${pid}" data-plat="${p}">
      <label for="plat-${pid}">${p}</label>`;
    div.querySelector('input').onchange = e => {
      if(e.target.checked) activePlats.add(p);
      else activePlats.delete(p);
      updatePlatBtn();
      render();
    };
    wrap.appendChild(div);
  });
}

function togglePlatDropdown(){
  document.getElementById('plat-dropdown').classList.toggle('open');
}

function clearPlats(){
  activePlats.clear();
  document.querySelectorAll('.plat-option input').forEach(i => i.checked = false);
  updatePlatBtn();
  render();
}

function updatePlatBtn(){
  const n = activePlats.size;
  const btn   = document.getElementById('plat-btn');
  const badge = document.getElementById('plat-badge');
  btn.classList.toggle('active', n > 0);
  badge.style.display = n > 0 ? 'inline-block' : 'none';
  badge.textContent = n;
}

function buildSidebar(){
  const sb = document.getElementById('sidebar');

  const lbl = document.createElement('div');
  lbl.className = 'sidebar-label';
  lbl.textContent = 'Parâmetros';
  sb.appendChild(lbl);

  // Botão Todos
  const all = document.createElement('a');
  all.className = 'nav-item nav-all on';
  const tot = DATA.reduce((a,b) => a + b.items.length, 0);
  all.innerHTML = 'Todos os parâmetros <span class="nav-count">' + tot + '</span>';
  all.href = '#';
  all.onclick = e => {
    e.preventDefault();
    activeFields.clear();
    document.querySelectorAll('.nav-item[data-id]').forEach(x => x.classList.remove('on'));
    all.classList.add('on');
    clearBtn.classList.remove('visible');
    render();
  };
  sb.appendChild(all);

  // Botão limpar seleção
  const clearBtn = document.createElement('div');
  clearBtn.className = 'nav-clear';
  clearBtn.textContent = '✕ limpar seleção';
  clearBtn.onclick = () => {
    activeFields.clear();
    document.querySelectorAll('.nav-item[data-id]').forEach(x => x.classList.remove('on'));
    all.classList.add('on');
    clearBtn.classList.remove('visible');
    render();
  };
  sb.appendChild(clearBtn);

  // Separar em grupos: Galileo (GL), Freetext (FT), Outros
  const grupos = [
    { label: 'Galileo', test: b => b.field.includes('GL') },
    { label: 'Freetext', test: b => b.field.includes('FT') },
    { label: 'Outros', test: b => !b.field.includes('GL') && !b.field.includes('FT') },
  ];

  function makeNavItem(block) {
    const a = document.createElement('a');
    a.className = 'nav-item';
    a.dataset.id = block.id;
    a.href = '#sec-' + block.id;
    a.innerHTML = esc(block.field) + '<span class="nav-count">' + block.items.length + '</span>';
    a.onclick = e => {
      e.preventDefault();
      if(activeFields.has(block.id)){
        activeFields.delete(block.id);
        a.classList.remove('on');
      } else {
        activeFields.add(block.id);
        a.classList.add('on');
        all.classList.remove('on');
      }
      if(activeFields.size === 0){
        all.classList.add('on');
        clearBtn.classList.remove('visible');
      } else {
        clearBtn.classList.add('visible');
      }
      render();
      if(activeFields.has(block.id)){
        const sec = document.getElementById('sec-' + block.id);
        if(sec) sec.scrollIntoView({behavior:'smooth', block:'start'});
      }
    };
    return a;
  }

  grupos.forEach(grupo => {
    const blocos = DATA.filter(grupo.test);
    if(!blocos.length) return;
    const grpLbl = document.createElement('div');
    grpLbl.className = 'nav-group-label';
    grpLbl.textContent = grupo.label;
    sb.appendChild(grpLbl);
    blocos.forEach(block => sb.appendChild(makeNavItem(block)));
  });
}

document.getElementById('search').addEventListener('input', e => {
  q = e.target.value;
  render();
});

buildPlatOptions();
buildSidebar();
render();

function expandAll() {
  DATA.forEach(block => {
    if(activeFields.size > 0 && !activeFields.has(block.id)) return;
    block.items.forEach(it => {
      openCards.add(block.id + '::' + it.opt);
    });
  });
  render();
}

function collapseAll() {
  openCards.clear();
  render();
}
</script>
</body>
</html>
