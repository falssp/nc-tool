    .btn { display:inline-block; padding:8px 16px; border-radius:9px; font-size:.8rem; font-weight:700; text-decoration:none; transition:opacity .18s; }

    .btn-manual { background:#fff; color:var(--azul); border:2px solid var(--azul); }
    footer { margin-top:40px; font-size:.72rem; color:var(--muted); }
    .back { display:inline-block; margin-bottom:24px; font-size:.8rem; color:var(--azul); text-decoration:none; font-weight:600; }
